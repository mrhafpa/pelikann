<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پلیکان دوچرخه‌سوار</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(180deg, #87ceeb 0%, #b3e5fc 60%, #fff9c4 100%);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  h1 {
    color: #1a237e;
    margin-bottom: 20px;
    font-size: 28px;
  }

  .scene {
    position: relative;
    width: 700px;
    height: 400px;
    background: #a5d6a7;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }

  .sun {
    position: absolute;
    top: 20px;
    left: 40px;
    width: 70px;
    height: 70px;
    background: #ffd54f;
    border-radius: 50%;
    box-shadow: 0 0 40px #ffd54f;
  }

  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.9;
    animation: floatCloud 12s linear infinite;
  }
  .cloud1 { top: 40px; left: 150px; width: 100px; height: 35px; }
  .cloud2 { top: 90px; left: 350px; width: 130px; height: 40px; animation-duration: 18s; }

  @keyframes floatCloud {
    from { transform: translateX(0); }
    to { transform: translateX(300px); }
  }

  .road {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 60px;
    background: #546e7a;
  }
  .road::before {
    content: "";
    position: absolute;
    top: 28px;
    left: 0;
    width: 200%;
    height: 4px;
    background: repeating-linear-gradient(90deg, #fff 0 40px, transparent 40px 80px);
    animation: roadMove 0.5s linear infinite;
  }
  @keyframes roadMove {
    from { transform: translateX(0); }
    to { transform: translateX(-80px); }
  }

  .bicycle-wrapper {
    position: absolute;
    bottom: 30px;
    left: 220px;
    animation: bounce 0.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .wheel {
    position: absolute;
    width: 80px;
    height: 80px;
    border: 6px solid #37474f;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .wheel::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 68px;
    height: 2px;
    background: #37474f;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 0 #37474f;
  }
  .wheel::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 68px;
    background: #37474f;
    transform: translate(-50%, -50%);
  }
  .wheel-back { top: 0; left: 0; }
  .wheel-front { top: 0; left: 160px; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .frame {
    position: absolute;
    bottom: 38px;
    left: 26px;
    width: 130px;
    height: 60px;
  }
  .frame div {
    position: absolute;
    background: #e53935;
    transform-origin: left center;
  }
  .tube1 { bottom: 20px; left: 20px; width: 70px; height: 7px; }
  .tube2 { bottom: 20px; left: 85px; width: 40px; height: 7px; transform: rotate(60deg); }
  .tube3 { bottom: 5px; left: 50px; width: 45px; height: 7px; transform: rotate(-50deg); }
  .handlebar {
    bottom: 55px; left: 110px;
    width: 8px; height: 35px;
    transform: rotate(-15deg);
    background: #37474f;
  }
  .seat {
    bottom: 45px; left: 35px;
    width: 30px; height: 8px;
    background: #37474f;
    border-radius: 4px;
  }
  .pedal {
    position: absolute;
    bottom: 30px;
    left: 40px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 4px solid #37474f;
    animation: spin 1s linear infinite;
  }
  .pedal::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 34px;
    height: 5px;
    background: #ffd54f;
    transform: translate(-50%, -50%);
    border-radius: 3px;
  }

  /* پلیکان */
  .pelican {
    position: absolute;
    bottom: 80px;
    left: 20px;
    width: 120px;
    height: 130px;
  }

  .pelican-body {
    position: absolute;
    bottom: 0;
    left: 10px;
    width: 90px;
    height: 70px;
    background: #e0e0e0;
    border-radius: 50% 50% 50% 40%;
    border: 3px solid #9e9e9e;
  }
  .pelican-body::after {
    content: "";
    position: absolute;
    left: 15px;
    top: 15px;
    width: 55px;
    height: 35px;
    background: #fafafa;
    border-radius: 50% 40% 50% 30%;
  }

  .pelican-wing {
    position: absolute;
    left: 25px;
    top: 15px;
    width: 50px;
    height: 45px;
    background: #bdbdbd;
    border-radius: 40% 60% 50% 50%;
    z-index: 2;
  }

  .pelican-neck {
    position: absolute;
    left: 75px;
    bottom: 40px;
    width: 18px;
    height: 60px;
    background: #e0e0e0;
    border-radius: 10px;
    border: 3px solid #9e9e9e;
  }

  .pelican-head {
    position: absolute;
    left: 70px;
    top: 0;
    width: 40px;
    height: 35px;
    background: #f5f5f5;
    border-radius: 50% 50% 40% 40%;
    border: 3px solid #9e9e9e;
  }

  .pelican-eye {
    position: absolute;
    left: 25px;
    top: 8px;
    width: 8px;
    height: 8px;
    background: #212121;
    border-radius: 50%;
  }

  /* منقار پلیکان */
  .pelican-beak {
    position: absolute;
    left: 38px;
    top: 12px;
    width: 60px;
    height: 18px;
    background: #ffb300;
    border-radius: 4px 50% 50% 4px;
  }
  .pelican-beak::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    width: 55px;
    height: 16px;
    background: #ff8f00;
    border-radius: 4px 50% 50% 4px;
  }

  /* پاها روی پدال */
  .pelican-leg {
    position: absolute;
    bottom: 5px;
    left: 40px;
    width: 10px;
    height: 50px;
    background: #ffb300;
    border-radius: 5px;
    transform-origin: top center;
    animation: pedalKick 1s ease-in-out infinite;
  }
  .pelican-leg.leg2 {
    left: 70px;
    animation-delay: 0.5s;
  }
  @keyframes pedalKick {
    0%, 100% { transform: rotate(-25deg); }
    50% { transform: rotate(25deg); }
  }

  .pelican-foot {
    position: absolute;
    bottom: -5px;
    left: -8px;
    width: 26px;
    height: 10px;
    background: #ff8f00;
    border-radius: 5px;
  }

  .title-card {
    position: absolute;
    bottom: 15px;
    right: 15px;
    background: rgba(255,255,255,0.85);
    padding: 8px 16px;
    border-radius: 12px;
    font-size: 16px;
    color: #37474f;
  }
</style>
</head>
<body>

<h1>🚴 پلیکان دوچرخه‌سوار</h1>

<div class="scene">
  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <div class="bicycle-wrapper">
    <!-- چرخ‌ها -->
    <div class="wheel wheel-back"></div>
    <div class="wheel wheel-front"></div>

    <!-- قاب دوچرخه -->
    <div class="frame">
      <div class="tube1"></div>
      <div class="tube2"></div>
      <div class="tube3"></div>
      <div class="handlebar"></div>
      <div class="seat"></div>
      <div class="pedal"></div>
    </div>

    <!-- پلیکان -->
    <div class="pelican">
      <div class="pelican-body"></div>
      <div class="pelican-wing"></div>
      <div class="pelican-neck"></div>
      <div class="pelican-head">
        <div class="pelican-eye"></div>
        <div class="pelican-beak"></div>
      </div>
      <div class="pelican-leg">
        <div class="pelican-foot"></div>
      </div>
      <div class="pelican-leg leg2">
        <div class="pelican-foot"></div>
      </div>
    </div>
  </div>

  <div class="road"></div>

  <div class="title-card">🚴‍♂️ پلیکان کوچولو در حال رکاب زدن...</div>
</div>

</body>
</html>
